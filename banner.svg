<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <style>
      /* Tipografia do Terminal (Cor Branca) */
      .text-base {
        font-family: 'Fira Code', Consolas, 'Courier New', monospace;
        font-size: 60px;
        font-weight: 700;
        fill: #ffffff; 
      }
      
      /* Cursor Piscante */
      .caret {
        fill: #ffffff;
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* Containers de Texto com Passos (Steps) Exatos por Letra */
      .txt-hello { width: 0; animation: typeHello 1s steps(6) forwards, untypeHello 1s steps(6) 2.5s forwards; }
      .txt-im { width: 0; animation: typeIm 0.6s steps(3) 4s forwards, untypeIm 0.6s steps(3) 5.6s forwards; }
      .txt-augusto { width: 0; animation: typeAugusto 1.5s steps(10) 6.8s forwards; }
      
      /* Larguras exatas baseadas em fonte monospace de 60px (cada letra = ~36px) */
      @keyframes typeHello { from { width: 0; } to { width: 216px; } }
      @keyframes untypeHello { from { width: 216px; } to { width: 0; } }
      
      @keyframes typeIm { from { width: 0; } to { width: 108px; } }
      @keyframes untypeIm { from { width: 108px; } to { width: 0; } }
      
      @keyframes typeAugusto { from { width: 0; } to { width: 360px; } }
      
      /* Sincronização do movimento do Cursor */
      .caret-move {
        transform: translateX(0);
        animation:
          cursorHello 1s steps(6) forwards,
          cursorUntypeHello 1s steps(6) 2.5s forwards,
          cursorIm 0.6s steps(3) 4s forwards,
          cursorUntypeIm 0.6s steps(3) 5.6s forwards,
          cursorAugusto 1.5s steps(10) 6.8s forwards;
      }
      @keyframes cursorHello { from { transform: translateX(0); } to { transform: translateX(216px); } }
      @keyframes cursorUntypeHello { from { transform: translateX(216px); } to { transform: translateX(0); } }
      @keyframes cursorIm { from { transform: translateX(0); } to { transform: translateX(108px); } }
      @keyframes cursorUntypeIm { from { transform: translateX(108px); } to { transform: translateX(0); } }
      @keyframes cursorAugusto { from { transform: translateX(0); } to { transform: translateX(360px); } }
      
      /* Emoticons e Linha do Tempo (Não entram em loop) */
      .face1 { animation: f1 12s forwards; opacity: 0; fill: #fbbf24; }
      .face2 { animation: f2 12s forwards; opacity: 0; fill: #fbbf24; }
      
      @keyframes f1 {
        0%, 74.9% { opacity: 0; }       /* Escondido até 9s */
        75%, 79.1% { opacity: 1; }      /* Aparece ( : */
        79.2%, 83.2% { opacity: 0; }    /* Esconde para a piscadinha */
        83.3%, 87.4% { opacity: 1; }    /* Volta ( : */
        87.5%, 100% { opacity: 0; }     /* Some para sempre */
      }
      @keyframes f2 {
        0%, 79.1% { opacity: 0; }
        79.2%, 83.2% { opacity: 1; }    /* Aparece ( ; piscando */
        83.3%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- BACKGROUND: Cor sólida de segurança caso o PNG demore a carregar -->
  <rect width="1584" height="396" fill="#0f172a" />
  
  <!-- A SUA ARTE AQUI: Puxa o arquivo que você exportar do Affinity -->
  <image href="assets/fundo_banner.png" width="1584" height="396" x="0" y="0" />

  <!-- GRUPO DE TEXTO E ANIMAÇÃO: Centralizado horizontalmente e verticalmente -->
  <g transform="translate(612, 210)">
    
    <!-- Máscaras que revelam as letras passo a passo -->
    <svg x="0" y="-55" width="216" height="70" class="txt-hello">
      <text x="0" y="55" class="text-base">Hello!</text>
    </svg>

    <svg x="0" y="-55" width="108" height="70" class="txt-im">
      <text x="0" y="55" class="text-base">I'm</text>
    </svg>

    <svg x="0" y="-55" width="360" height="70" class="txt-augusto">
      <text x="0" y="55" class="text-base">AugustoCGM</text>
    </svg>
    
    <!-- Cursor do Terminal -->
    <g class="caret-move">
      <rect x="6" y="-50" width="5" height="60" class="caret" rx="2" />
    </g>
    
    <!-- Emoticons -->
    <g transform="translate(380, 0)">
      <text x="0" y="0" class="text-base face1">( :</text>
      <text x="0" y="0" class="text-base face2">( ;</text>
    </g>
    
  </g>
</svg>
