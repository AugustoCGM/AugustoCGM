<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Gradiente de Fundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Gradiente do Terminal -->
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Brilho Neon / Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <style>
      @keyframes typeHello {
        0% { opacity: 0; width: 0; }
        5% { opacity: 1; width: 0; }
        15% { width: 180px; }
        25% { width: 180px; opacity: 1; }
        32% { width: 0; opacity: 1; }
        33% { opacity: 0; }
        100% { opacity: 0; width: 0; }
      }

      @keyframes typeIm {
        0%, 34% { opacity: 0; width: 0; }
        36% { opacity: 1; width: 0; }
        44% { width: 110px; }
        54% { width: 110px; opacity: 1; }
        60% { width: 0; opacity: 1; }
        61% { opacity: 0; }
        100% { opacity: 0; width: 0; }
      }

      @keyframes typeAugusto {
        0%, 62% { opacity: 0; width: 0; }
        64% { opacity: 1; width: 0; }
        76% { width: 340px; opacity: 1; }
        100% { width: 340px; opacity: 1; }
      }

      @keyframes winkFace {
        0%, 75% { opacity: 0; }
        77% { opacity: 1; }
        83% { opacity: 1; }
        84% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes winkFaceBlink {
        0%, 83% { opacity: 0; }
        84% { opacity: 1; }
        89% { opacity: 1; }
        90% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes winkFaceBack {
        0%, 89% { opacity: 0; }
        90% { opacity: 1; }
        96% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .text-base {
        font-family: 'Fira Code', 'Courier New', Consolas, monospace;
        font-size: 32px;
        font-weight: 700;
        fill: #f8fafc;
      }

      .cursor {
        animation: cursorBlink 0.8s infinite;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- 1. Background com Grade Sutil -->
  <rect width="1584" height="396" fill="url(#bgGrad)" />
  <rect width="1584" height="396" fill="url(#grid)" />

  <!-- Detalhes de Luz de Fundo (Aura / Glow) -->
  <circle cx="280" cy="198" r="160" fill="#38bdf8" opacity="0.06" filter="blur(40px)" />
  <circle cx="1300" cy="198" r="160" fill="#818cf8" opacity="0.06" filter="blur(40px)" />

  <!-- 2. Lateral Esquerda: Mockup Estilizado de Landing Page / Hero UI -->
  <g transform="translate(60, 58)" opacity="0.85">
    <!-- Moldura de Janela -->
    <rect width="320" height="280" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect width="320" height="34" rx="12" fill="#1e293b" />
    <circle cx="20" cy="17" r="5" fill="#f43f5e" />
    <circle cx="36" cy="17" r="5" fill="#fbbf24" />
    <circle cx="52" cy="17" r="5" fill="#10b981" />
    
    <!-- Wireframe de Landing Page -->
    <rect x="24" y="54" width="110" height="14" rx="4" fill="url(#accentGrad)" />
    <rect x="24" y="78" width="180" height="10" rx="3" fill="#475569" />
    <rect x="24" y="96" width="150" height="8" rx="3" fill="#334155" />
    <rect x="24" y="112" width="130" height="8" rx="3" fill="#334155" />
    <rect x="24" y="136" width="70" height="22" rx="6" fill="#38bdf8" opacity="0.9" />

    <!-- Card de imagem / hero mockup à direita da landing page -->
    <rect x="180" y="130" width="115" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <path d="M 195 210 Q 220 180 240 200 T 280 180" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.5"/>
    <circle cx="215" cy="165" r="10" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- 3. Lateral Direita: Mockup Estilizado de App / Mobile / Cards -->
  <g transform="translate(1204, 58)" opacity="0.85">
    <rect width="320" height="280" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect width="320" height="34" rx="12" fill="#1e293b" />
    <circle cx="20" cy="17" r="5" fill="#f43f5e" />
    <circle cx="36" cy="17" r="5" fill="#fbbf24" />
    <circle cx="52" cy="17" r="5" fill="#10b981" />

    <!-- Cards internos simulando UI components -->
    <rect x="24" y="54" width="272" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="54" cy="84" r="14" fill="#818cf8" opacity="0.8"/>
    <rect x="80" y="74" width="90" height="8" rx="3" fill="#94a3b8"/>
    <rect x="80" y="88" width="60" height="6" rx="2" fill="#475569"/>

    <rect x="24" y="126" width="272" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="54" cy="156" r="14" fill="#38bdf8" opacity="0.8"/>
    <rect x="80" y="146" width="110" height="8" rx="3" fill="#94a3b8"/>
    <rect x="80" y="160" width="70" height="6" rx="2" fill="#475569"/>

    <rect x="24" y="200" width="130" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="166" y="200" width="130" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- 4. Centro: Terminal Principal com a Animação -->
  <g transform="translate(442, 68)">
    <!-- Moldura e Vidro do Terminal -->
    <rect width="700" height="260" rx="16" fill="url(#terminalGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" />
    <rect width="700" height="42" rx="16" fill="#0b1120" />
    <!-- Botões estilo Mac -->
    <circle cx="28" cy="21" r="6" fill="#ef4444" />
    <circle cx="48" cy="21" r="6" fill="#f59e0b" />
    <circle cx="68" cy="21" r="6" fill="#10b981" />
    <!-- Título da Aba -->
    <text x="350" y="26" fill="#64748b" font-family="'Fira Code', monospace" font-size="13" text-anchor="middle">bash - dev@augustocgm:~</text>

    <!-- Linha de Comando Prompt -->
    <g transform="translate(45, 120)">
      <text x="0" y="32" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="28" font-weight="700">~&gt;</text>
      
      <!-- Container da Animação de Digitação -->
      <g transform="translate(60, 0)">
        
        <!-- Fase 1: Hello! -->
        <g style="overflow: hidden; display: inline-block;">
          <svg x="0" y="0" width="360" height="50" style="animation: typeHello 9s cubic-bezier(0.4, 0, 0.2, 1) infinite;">
            <text x="0" y="32" class="text-base">Hello!</text>
          </svg>
        </g>

        <!-- Fase 2: I'm -->
        <g>
          <svg x="0" y="0" width="360" height="50" style="animation: typeIm 9s cubic-bezier(0.4, 0, 0.2, 1) infinite;">
            <text x="0" y="32" class="text-base">I'm</text>
          </svg>
        </g>

        <!-- Fase 3: AugustoCGM (Permanece no final) -->
        <g>
          <svg x="0" y="0" width="360" height="50" style="animation: typeAugusto 9s steps(12) infinite;">
            <text x="0" y="32" class="text-base" fill="url(#accentGrad)">AugustoCGM</text>
          </svg>
        </g>

        <!-- Emoticons: (: -> (; -> (: -> some -->
        <g transform="translate(230, 0)">
          <!-- Estado 1: (: -->
          <text x="0" y="32" class="text-base" fill="#fbbf24" style="animation: winkFace 9s ease infinite;">( :</text>
          <!-- Estado 2: (; Piscada -->
          <text x="0" y="32" class="text-base" fill="#fbbf24" style="animation: winkFaceBlink 9s ease infinite;">( ;</text>
          <!-- Estado 3: (: Volta e some -->
          <text x="0" y="32" class="text-base" fill="#fbbf24" style="animation: winkFaceBack 9s ease infinite;">( :</text>
        </g>

        <!-- Cursor de Terminal Piscante -->
        <rect x="220" y="5" width="12" height="32" class="cursor" rx="2" />
      </g>
    </g>

    <!-- Subtítulo sutil dentro do terminal -->
    <text x="105" y="195" fill="#64748b" font-family="'Fira Code', monospace" font-size="15">
      // Software Engineer &amp; UI/UX Enthusiast
    </text>
  </g>
</svg>
